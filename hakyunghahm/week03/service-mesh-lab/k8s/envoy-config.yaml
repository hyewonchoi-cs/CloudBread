apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: egress
        address:
          socket_address:
            address: 127.0.0.1
            port_value: 9000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              codec_type: AUTO
              stat_prefix: egress
              route_config:
                name: local_route
                virtual_hosts:
                - name: service_b
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: service_b
                      timeout: 1s
                      retry_policy:
                        retry_on: "5xx,reset,connect-failure,refused-stream,gateway-error"
                        num_retries: 2
                        per_try_timeout: 1s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: service_b
        connect_timeout: 0.5s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        load_assignment:
          cluster_name: service_b
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: service-b
                    port_value: 8081
        outlier_detection:
          consecutive_5xx: 3
          interval: 10s
          base_ejection_time: 30s
          max_ejection_percent: 100

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901